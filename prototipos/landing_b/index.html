<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Landing B - Con Horario</title>
<link rel="stylesheet" href="../assets/estilos.css">
<script src="../assets/pantallas.js"></script>
</head>
<body>
<div class="container">
  <div id="home" class="screen">
    <h1>Pack de Leña</h1>
    <div class="card">
      <h2>Precio final: $350</h2>
      <label>Elegí tu horario:</label>
      <select>
        <option>15–17h</option>
        <option>17–19h</option>
      </select>
      <a class="btn" href="#" onclick="show('confirm')">Continuar</a>
    </div>
  </div>
  <div id="confirm" class="screen hidden">
    <h2>Confirmación</h2>
    <p>Tu intención quedó registrada.</p>
    <a class="btn" href="#" onclick="show('home')">Volver</a>
  </div>
</div>
</body>
</html>
